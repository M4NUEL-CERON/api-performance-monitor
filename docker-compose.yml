# docker compose up --build                        -> API on :8080, dashboard on :3000
# docker compose --profile monitoring up --build   -> also Prometheus on :9090, Grafana on :3001
services:
  backend:
    build: .
    ports: ["8080:8080"]
    environment:
      CORS_ALLOWED_ORIGINS: http://localhost:3000

  frontend:
    build:
      context: frontend
      args:
        VITE_API_URL: http://localhost:8080
    ports: ["3000:80"]
    depends_on: [backend]

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    depends_on: [backend]

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [monitoring]
    environment: # local-only convenience: no login
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes: ["./monitoring/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro"]
    ports: ["3001:3000"]
    depends_on: [prometheus]
