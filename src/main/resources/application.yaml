spring:
  application:
    name: api-performance-monitor
  datasource:
    url: jdbc:h2:mem:performancedb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

server:
  port: ${PORT:8080}

app:
  # Comma-separated list, e.g. https://apm.vercel.app,http://localhost:5173
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  metrics:
    distribution:
      percentiles:
        http.server.requests: 0.5, 0.99, 0.995
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms, 1s
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.example.apiperformancemonitor: INFO